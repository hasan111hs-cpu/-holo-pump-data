name: Simple Live Data

on:
  workflow_dispatch:
  schedule:
    # BACKUP only. GitHub cron ran ~4h late on 2026-09-30 and 2026-10-01.
    # Primary trigger = external workflow_dispatch at 18:02 UTC (22:02 Dubai).
    - cron: "2 18 * * *"

permissions:
  contents: write

concurrency:
  group: simple-live-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and settle Binance Spot data
        run: python scripts/simple_live.py

      - name: Commit Simple signals and settlements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add simple_live/ simple_settlements/

          if git diff --cached --quiet; then
            echo "No new Simple data to commit."
            exit 0
          fi

          git commit -m "Update Simple live data and settlements $(date -u +%F)"

          # Other workflows push to this branch too; retry with rebase.
          for attempt in 1 2 3 4 5 6; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing"
            git pull --rebase origin "$GITHUB_REF_NAME" || { git rebase --abort; sleep 2; continue; }
            sleep $((attempt * 2))
          done
          echo "::error::Push failed after 6 attempts"
          exit 1
