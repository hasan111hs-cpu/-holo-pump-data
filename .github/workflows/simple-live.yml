name: Simple Live Data

on:
  workflow_dispatch:
  schedule:
    # 18:02 UTC = 22:02 Dubai (UTC+4 year-round)
    - cron: "2 18 * * *"

permissions:
  contents: write

concurrency:
  group: simple-live-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect Binance Spot data
        run: python scripts/simple_live.py

      - name: Commit canonical Simple live file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add simple_live/

          if git diff --cached --quiet; then
            echo "No new Simple live data to commit."
            exit 0
          fi

          git commit -m "Update Simple live data $(date -u +%F)"
          git push
