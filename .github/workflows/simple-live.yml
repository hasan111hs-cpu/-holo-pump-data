name: Simple Live Data

# RETIRED 2026-10-03. Superseded by scripts/simple_book.py (run from simple-fast-signal.yml),
# which keeps the official record in simple_book/ and simple_reports/.
# The old files in simple_live/ and simple_settlements/ are kept as history only.
# The job below is switched off; a manual or external dispatch does nothing.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simple-live-data
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ false }}   # retired - see note at top
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and settle Binance Spot data
        run: python scripts/simple_live.py

      - name: Commit Simple signals and settlements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add simple_live/ simple_settlements/

          if git diff --cached --quiet; then
            echo "No new Simple data to commit."
            exit 0
          fi

          git commit -m "Update Simple live data and settlements $(date -u +%F)"

          # Other workflows push to this branch too; retry with rebase.
          for attempt in 1 2 3 4 5 6; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing"
            git pull --rebase origin "$GITHUB_REF_NAME" || { git rebase --abort; sleep 2; continue; }
            sleep $((attempt * 2))
          done
          echo "::error::Push failed after 6 attempts"
          exit 1
