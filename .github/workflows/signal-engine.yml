name: Canonical Signal Engine

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: "Purpose of this run"
        required: true
        default: test
        type: choice
        options: [test, reconstruction, PRIMARY_EXTERNAL, RECOVERY_EXTERNAL]
  schedule:
    # GitHub cron is retained ONLY as post-deadline audit/settlement redundancy.
    # Primary and recovery canonical triggers are now external (16:48 / 17:20 UTC).
    - cron: "30 19 * * *"     # POST_DEADLINE_AUDIT only
    - cron: "0 21 * * *"      # POST_DEADLINE_AUDIT only
    - cron: "0 23 * * *"      # POST_DEADLINE_AUDIT only

permissions:
  contents: write

# §7 serialise, never cancel: two runs must not mutate canonical artifacts at once.
concurrency:
  group: canonical-signal-engine
  cancel-in-progress: false

env:
  HEARTBEAT_TRIGGER: ${{ github.event_name }}
  HEARTBEAT_SLOT: ${{ github.event.schedule || 'workflow_dispatch' }}
  HEARTBEAT_PURPOSE: ${{ github.event.inputs.purpose || 'scheduled' }}

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # §2/§3 canonical automatic authority requires BOTH an approved role AND the
      # approved machine actor. A human selecting PRIMARY_EXTERNAL is still MANUAL.
      - name: Resolve trigger role
        run: |
          EVENT="${{ github.event_name }}"
          ACTOR="${{ github.actor }}"
          APPROVED="${{ vars.SCHEDULER_ACTOR }}"
          REQUESTED="${{ github.event.inputs.purpose }}"
          SLOT="${{ github.event.schedule }}"
          ROLE="MANUAL"
          if [ "$EVENT" = "schedule" ]; then
            ROLE="POST_DEADLINE_AUDIT"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            case "$REQUESTED" in
              PRIMARY_EXTERNAL|RECOVERY_EXTERNAL)
                if [ -n "$APPROVED" ] && [ "$ACTOR" = "$APPROVED" ]; then
                  ROLE="$REQUESTED"
                else
                  echo "DENIED: actor '$ACTOR' is not the approved scheduler identity"
                  echo "        requested role '$REQUESTED' downgraded to MANUAL"
                  ROLE="MANUAL"
                fi
                ;;
            esac
          fi
          echo "event=$EVENT actor=$ACTOR slot=$SLOT requested=$REQUESTED -> role=$ROLE"
          echo "HEARTBEAT_ROLE=$ROLE" >> $GITHUB_ENV

      - name: Signal job started
        run: |
          python heartbeat.py mark SIGNAL_JOB_EXPECTED ok "16:47 UTC cutoff"
          python heartbeat.py mark SIGNAL_JOB_STARTED ok "run ${{ github.run_number }} ${{ github.event_name }} role=$HEARTBEAT_ROLE"

      - name: Refresh market data
        run: python collector.py

      - name: Refresh BTC dominance
        run: python btc_d_collector.py

      - name: Collector health
        run: python heartbeat.py mark COLLECTOR_HEALTH_CHECK ok "collector + btc_d completed"

      - name: Collector failure
        if: failure()
        run: python heartbeat.py mark COLLECTOR_HEALTH_CHECK failed "collector raised"

      # §8 later crons are RECOVERY/AUDIT only and may not create a canonical signal
      - name: Hard-deadline gate
        id: gate
        continue-on-error: true
        run: python heartbeat.py may_lock

      - name: Compute today's signal
        if: steps.gate.outcome == 'success'
        run: |
          python signal.py
          python heartbeat.py mark DATA_AUDIT_COMPLETE ok "signal.py completed"

      # §5 CRITICAL PERSISTENCE. SIGNAL_LOCKED is asserted only after the immutable
      # artifact is durably stored. Execution may not begin before this succeeds.
      - name: Persist signal artifact (critical)
        if: steps.gate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add signals/ data/BTC-D.json
          if git diff --cached --quiet; then
            echo "no new signal artifact to persist"
          else
            git commit -m "Signal lock $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "local SHA:  $(git rev-parse HEAD)"
            echo "remote SHA: $(git ls-remote origin main | cut -f1)"
            persisted=0
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "PERSISTED on push attempt $attempt"; persisted=1; break
              fi
              echo "push rejected on attempt $attempt, rebasing"
              git pull --rebase --autostash origin main || true
            done
            if [ "$persisted" != "1" ]; then
              echo "CRITICAL PERSISTENCE FAILURE: signal artifact not durably stored"
              python heartbeat.py mark SIGNAL_LOCKED failed "critical persistence failed after 5 attempts"
              exit 1
            fi
          fi
          # SIGNAL_LOCKED may only be asserted if a signal record actually exists.
          # signal.py declines to write one before the cutoff or when a record is
          # already present, and "nothing to commit" must never imply a lock.
          TODAY=$(date -u +%Y-%m-%d)
          if [ -f "signals/$TODAY.json" ]; then
            python heartbeat.py mark SIGNAL_LOCKED ok "artifact durably persisted to origin/main"
          else
            echo "no signal record for $TODAY - SIGNAL_LOCKED not asserted"
            python heartbeat.py mark SIGNAL_LOCKED failed "no signal record written for this execution date"
          fi

      # §6 quarantine any signal lacking a valid pre-deadline durable lock BEFORE
      # execute.py runs. execute.py will then skip it via its own immutability guard.
      - name: Verify pre-deadline locks
        if: always()
        run: python heartbeat.py verify_locks

      - name: Settle prior executions
        if: always()
        run: |
          python heartbeat.py mark EXECUTION_JOB_EXPECTED ok "18:05 UTC activation"
          python heartbeat.py mark EXECUTION_JOB_STARTED ok
          python execute.py

      - name: Report generated
        if: always()
        run: python heartbeat.py mark REPORT_GENERATED ok

      - name: Operational audit
        if: always()
        run: |
          python heartbeat.py audit
          python heartbeat.py sweep
          python heartbeat.py annotate

      # Remaining artifacts: executions, ledgers, operational logs.
      - name: Persist remaining artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add data/BTC-D.json signals/ executions/ ledgers/ operational_logs/
          if git diff --cached --quiet; then
            echo "Nothing further to commit"; exit 0
          fi
          git commit -m "Execution + heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "local SHA:  $(git rev-parse HEAD)"
          echo "remote SHA: $(git ls-remote origin main | cut -f1)"
          for attempt in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push rejected on attempt $attempt, rebasing"
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 5))
          done
          echo "ERROR: canonical artifacts not durably stored after 5 attempts"
          exit 1
