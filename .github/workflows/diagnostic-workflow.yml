name: Matched-Volume Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh market data
        run: python collector.py

      - name: Run matched-volume diagnostic
        run: python diagnose_volume.py

      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Matched-volume diagnostic $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
