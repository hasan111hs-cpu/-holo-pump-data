name: Research - Simple backtest

on:
  push:
    branches: ["claude/research-simple-backtest"]
    paths: ["research/simple_backtest/backtest.py", ".github/workflows/research-simple-backtest.yml"]

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run backtest
        run: python3 research/simple_backtest/backtest.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/simple_backtest/results.json
          git commit -m "Simple backtest results"
          git push origin "HEAD:$GITHUB_REF_NAME"
