name: Universe Portfolio Search

# UNIVERSE_PORTFOLIO_SEARCH. The CLV edge across ~40 coins, equal-weight portfolio.
# In-sample only. Writes to research/universe_search/.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universe-search
  cancel-in-progress: false

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search portfolio configurations across the universe
        run: python universe_search.py

      - name: Commit research artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add research/universe_search/
          git diff --cached --quiet && exit 0
          git commit -m "UNIVERSE_PORTFOLIO_SEARCH: CLV edge across ~40 coins"
          for a in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase --autostash origin main || true
            sleep $((a * 5))
          done
          exit 1
