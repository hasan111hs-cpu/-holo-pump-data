name: Simple Fast Signal

# LIVE PATH  = workflow_dispatch fired by the EXTERNAL scheduler (same one that
#              already fires the Canonical Signal Engine at 16:48 UTC):
#                18:00:15 UTC  role=PRIMARY_EXTERNAL
#                18:02:00 UTC  role=RECOVERY_EXTERNAL   (no-op if canonical exists)
# BACKUP     = GitHub cron below. GitHub documents that scheduled runs can be
#              delayed at the top of the hour or dropped under load (this repo saw
#              ~4h delays on 2026-09-30 and a missing run on 2026-10-01), so cron
#              runs are audit/backfill only. A late run still produces a canonical
#              file, but it is stamped live_eligible=false and must not be traded.

on:
  workflow_dispatch:
    inputs:
      role:
        description: "Trigger role"
        required: true
        default: MANUAL
        type: choice
        options: [PRIMARY_EXTERNAL, RECOVERY_EXTERNAL, MANUAL]
  schedule:
    - cron: "3 18 * * *"    # SCHEDULE_BACKUP (off the top-of-hour peak)
    - cron: "23 18 * * *"   # SCHEDULE_BACKUP (audit backfill)

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # Serialise, never cancel: a second run starts only after the first has pushed,
    # so it sees the canonical file and becomes a no-op.
    concurrency:
      group: simple-fast-signal
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      # No setup-python step: the script is stdlib-only and ubuntu-latest ships
      # Python 3, which saves 10-20 s on the critical path.

      - name: Resolve trigger role
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.role }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          APPROVED: ${{ vars.SCHEDULER_ACTOR }}
        run: |
          ROLE="MANUAL"
          if [ "$EVENT" = "schedule" ]; then
            ROLE="SCHEDULE_BACKUP"
          elif [ "$REQUESTED" = "PRIMARY_EXTERNAL" ] || [ "$REQUESTED" = "RECOVERY_EXTERNAL" ]; then
            if [ -n "$APPROVED" ] && { [ "$ACTOR" = "$APPROVED" ] || [ "$TRIGGERING_ACTOR" = "$APPROVED" ]; }; then
              ROLE="$REQUESTED"
            else
              echo "Actor '$ACTOR' is not SCHEDULER_ACTOR -> role downgraded to MANUAL"
            fi
          fi
          echo "event=$EVENT requested=$REQUESTED actor=$ACTOR -> role=$ROLE"
          echo "TRIGGER_ROLE=$ROLE" >> "$GITHUB_ENV"

      - name: Generate fast Simple signal
        id: gen
        run: python3 scripts/simple_signal_fast.py

      # Six-strategy bookkeeping: immutable decisions, settle positions that are due,
      # rebuild the ledger, write simple_reports/<date>.json. Strategy rules are unchanged.
      - name: Decisions, settlement, ledger and nightly report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/simple_book.py nightly

      - name: Commit signal and attempt log (first writer wins)
        if: always()
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Never commit a canonical file if one already exists upstream.
          git fetch --depth=1 origin "$GITHUB_REF_NAME"
          for f in $(git ls-files --others --exclude-standard -- 'simple_fast/*.json' ':!simple_fast/attempts/**'); do
            if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then
              echo "Upstream already has $f -> discarding local copy (immutable)."
              rm -f "$f"
            fi
          done

          git add simple_fast/ simple_book/ simple_reports/ 2>/dev/null || git add simple_fast/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Update Simple fast signal $(date -u +%F) [$TRIGGER_ROLE run ${GITHUB_RUN_ID}]"

          # Other workflows push to main too; retry with rebase. During a rebase
          # '-X ours' means UPSTREAM wins any conflict, so an existing canonical
          # file can never be replaced.
          for attempt in 1 2 3 4 5 6; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/$GITHUB_REF_NAME"
            git pull --rebase -X ours origin "$GITHUB_REF_NAME" || { git rebase --abort; sleep 2; continue; }
            sleep $((attempt * 2))
          done
          echo "::error::Push failed after 6 attempts"
          exit 1

  # Records the entry price for tonight's BUY decisions at 22:05 Dubai (18:05 UTC):
  # a price a person could really act on after reading the 22:02 report.
  entry:
    needs: signal
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: simple-entry
      cancel-in-progress: false
    steps:
      - name: Checkout latest branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Capture entries at 22:05 Dubai, then update ledger and report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Wait outside the checkout so the commit below is based on fresh history.
          python3 scripts/simple_book.py entry

      - name: Commit entry records
        if: always()
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simple_book/ simple_reports/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Update Simple entries and report $(date -u +%F) [run ${GITHUB_RUN_ID}]"
          for attempt in 1 2 3 4 5 6; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing"
            git pull --rebase -X ours origin "$GITHUB_REF_NAME" || { git rebase --abort; sleep 2; continue; }
            sleep $((attempt * 2))
          done
          echo "::error::Push failed after 6 attempts"
          exit 1
