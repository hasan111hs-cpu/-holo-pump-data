name: Audit A-2 7-day continuity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a2-continuity-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Stage 1 verified working cache
        id: stage1-cache
        uses: actions/cache/restore@v4
        with:
          path: _stage1_cache
          key: stage1-cache-${{ github.run_id }}
          restore-keys: |
            stage1-cache-

      - name: Require restored Stage 1 cache
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.stage1-cache.outputs.cache-matched-key }}" = "" ]; then
            echo "ERROR: no Stage 1 cache matched prefix stage1-cache-." >&2
            exit 1
          fi
          if [ ! -d "_stage1_cache/data/futures/um/monthly/klines" ]; then
            echo "ERROR: restored cache does not contain expected Binance monthly kline hierarchy." >&2
            exit 1
          fi
          if [ ! -f "research/multicoin_expansion/universe.json" ]; then
            echo "ERROR: frozen universe artifact is absent." >&2
            exit 1
          fi
          echo "Restored cache key: ${{ steps.stage1-cache.outputs.cache-matched-key }}"

      - name: Run A-2 continuity audit
        run: python scripts/audit_a2_continuity.py

      - name: Upload continuity audit result
        uses: actions/upload-artifact@v4
        with:
          name: a2-continuity-audit
          path: research/multicoin_expansion/a2_continuity_audit.json
          if-no-files-found: error
